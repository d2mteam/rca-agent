services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    mem_limit: 64m
    networks: [edge]

  backend:
    image: hitl-demo-backend:1.0.0
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hitl
      DATABASE_USER: hitl
      DATABASE_PASSWORD: demo-only-password
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 45s
    networks: [edge, data]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hitl
      POSTGRES_USER: hitl
      POSTGRES_PASSWORD: demo-only-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitl -d hitl"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    networks: [data]

volumes:
  db-data: {}

networks:
  edge: {}
  data:
    internal: true
