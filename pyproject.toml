[project]
name = "hitl-infra"
version = "0.1.0"
description = "Human-approved Docker plans with LangGraph, MCP and runtime verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "sqlmodel>=0.0.24,<0.1",
  "docker>=7,<8",
  "mcp>=1.20,<2",
  "ruamel-yaml>=0.18,<0.19",
  "httpx>=0.28,<1",
  "filelock>=3.17,<4",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "sse-starlette>=2,<4",
  "tenacity>=9,<10",
]

[project.scripts]
infra = "hitl.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/hitl"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
