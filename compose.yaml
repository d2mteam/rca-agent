name: hitl-console
services:
  console:
    image: hitl-infra:local
    build: .
    init: true
    restart: unless-stopped
    network_mode: host
    user: "${HITL_UID:?Run bash scripts/setup.sh}:${HITL_GID:?Run bash scripts/setup.sh}"
    group_add:
      - "${DOCKER_GID:?Run bash scripts/setup.sh}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Management socket and workload bind files must be accessible on SELinux hosts.
      - label=disable
    environment:
      HITL_DATA_DIR: "${HITL_DATA_DIR:?Run bash scripts/setup.sh}"
      HITL_PORT: "${HITL_PORT:-8765}"
      DOCKER_HOST: unix:///var/run/docker.sock
      CODEX_HOME: "${HITL_DATA_DIR}/codex"
      HITL_CODEX_MODEL: "${HITL_CODEX_MODEL:-}"
    volumes:
      - type: bind
        source: "${DOCKER_SOCKET:?Run bash scripts/setup.sh}"
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # Docker resolves workload bind mounts on the host, so both paths must match.
      - type: bind
        source: "${HITL_DATA_DIR}"
        target: "${HITL_DATA_DIR}"
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['HITL_PORT']+'/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 15s
      retries: 3
