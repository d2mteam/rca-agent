spring.application.name=hitl-demo-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db:5432/hitl}
spring.datasource.username=${DATABASE_USER:hitl}
spring.datasource.password=${DATABASE_PASSWORD:demo-only-password}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.jdbc.template.query-timeout=3
spring.flyway.enabled=true
server.port=8080
server.shutdown=graceful
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
spring.lifecycle.timeout-per-shutdown-phase=10s
server.error.include-message=never
